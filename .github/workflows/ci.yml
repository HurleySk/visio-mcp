name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # No floating major tag from v8 on.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv lock --check
      - run: uv sync --locked --compile-bytecode
      - run: uv run pytest -v
